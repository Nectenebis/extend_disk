name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-guest-utils fdisk e2fsprogs dosfstools fatresize
      - name: Run unit and disk-image tests
        run: python -m unittest discover -s tests -v
      - name: Install Ansible
        if: matrix.python == '3.12'
        run: python -m pip install ansible-core==2.21.5
      - name: Validate Ansible role
        if: matrix.python == '3.12'
        run: |
          python tests/check_role.py
          ansible-playbook -i localhost, tests/role.yml --syntax-check
          ansible-playbook -i localhost, tests/role.yml --check
