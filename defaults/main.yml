---
extend_disk_packages_by_manager:
  apt:
    - python3
    - lvm2
    - cloud-guest-utils
    - util-linux
    - udev
    - xfsprogs
    - e2fsprogs
  rpm:
    - python3
    - lvm2
    - cloud-utils-growpart
    - util-linux
    - systemd-udev
    - xfsprogs
    - e2fsprogs

# Debian/Astra use apt; RED OS uses dnf/yum. Override for local repositories.
extend_disk_packages: >-
  {{ extend_disk_packages_by_manager['apt' if ansible_facts['pkg_mgr'] == 'apt' else 'rpm'] }}

# Set to true to show what would be extended without changing disks.
extend_disk_dry_run: false

# Empty means automatic discovery. Example: ['/dev/sda', '/dev/sdb'].
extend_disk_devices: []

# Per-disk overrides; other disks keep automatic selection. Comma/space separated.
# Bare path gets the VG remainder; sizes are ADDED, percentages use post-growth VG free space.
# Examples: "/second_data", "/data=20GiB, /logs", "/data=40% /logs=60%".
# Units are case-insensitive: GB/gb=1000^3, GiB/gib=1024^3.
extend_disk_mountpoints: ""
